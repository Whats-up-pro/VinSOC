name: SOC one-case real E2E demo
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/soc-traces-demo-e2e-once.yml
      - scripts/run_soc_demo_cloud.py
      - evaluation/soc_traces_v1/demo.py
permissions:
  contents: write
  actions: read
concurrency:
  group: soc-demo-20261009-v1
  cancel-in-progress: false
jobs:
  soc-demo-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: |
          python -m pip install -r requirements.txt
          python -m pip install duckdb==1.5.5
      - name: Run one authentic alert-to-report case
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/run_soc_demo_cloud.py "$RUNNER_TEMP/soc-demo"
      - name: Preserve sanitized E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soc-demo-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/soc-demo
          if-no-files-found: error
          retention-days: 90
