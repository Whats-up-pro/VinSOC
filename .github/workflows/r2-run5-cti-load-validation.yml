name: R2 run-5 offline CTI load validation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r2-run5-cti-load-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_RUN_ID: '36235433476'
      SOURCE_ARTIFACT_ID: '10904266318'
      SOURCE_ARTIFACT_NAME: r2-official-frozen-source-bytes
      SOURCE_ARTIFACT_DIGEST: sha256:a3858d1a92f15b70fc0d629a46f7c6eff6763caffde8b43077eabff74186d8f8
      SOURCE_CIPHERTEXT_SHA256: b39c70b47bdef1c9668d3dde250ad11880516744ebb7edd98748fc8eded61f65
      THREATFOX_ZIP_SHA256: 0aa5b4371970bc4fd16c111cc65b2a7a54c744a810fa15054206640de36260ac
      THREATFOX_FULL_CSV_SHA256: 5df2498e5abc1d5f9c1564d16b6f00618611943cba7cc25dab12b2ed5c5ccd46
      BUILDER_VERSION: vinsoc_public_snapshot_v2_official
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Require the source-retention secret
        env:
          SOURCE_RETENTION_PASSPHRASE: ${{ secrets.R2_SOURCE_RETENTION_PASSPHRASE }}
        run: |
          if [ -z "$SOURCE_RETENTION_PASSPHRASE" ]; then
            echo "R2_SOURCE_RETENTION_PASSPHRASE is unavailable; refusing validation."
            exit 1
          fi
      - name: Verify and download the fixed run-5 encrypted artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/run5-encrypted"
          gh api \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" \
            > "$RUNNER_TEMP/run5-artifact.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          record = json.loads(
              Path(os.environ["RUNNER_TEMP"])
              .joinpath("run5-artifact.json")
              .read_text(encoding="utf-8")
          )
          expected = {
              "id": int(os.environ["SOURCE_ARTIFACT_ID"]),
              "name": os.environ["SOURCE_ARTIFACT_NAME"],
              "digest": os.environ["SOURCE_ARTIFACT_DIGEST"],
          }
          for key, value in expected.items():
              if record.get(key) != value:
                  raise SystemExit(f"Run-5 artifact {key} mismatch")
          if (record.get("workflow_run") or {}).get("id") != int(os.environ["SOURCE_RUN_ID"]):
              raise SystemExit("Run-5 artifact workflow identity mismatch")
          if record.get("expired") is not False:
              raise SystemExit("Run-5 artifact is expired")
          PY
          gh api \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/run5-artifact.zip"
          unzip -q "$RUNNER_TEMP/run5-artifact.zip" \
            -d "$RUNNER_TEMP/run5-encrypted"
          printf '%s  %s\n' \
            "$SOURCE_CIPHERTEXT_SHA256" \
            "$RUNNER_TEMP/run5-encrypted/r2-official-frozen-source-bytes.tar.enc" \
          | sha256sum -c -
      - name: Decrypt retained bytes in runner temp
        env:
          SOURCE_RETENTION_PASSPHRASE: ${{ secrets.R2_SOURCE_RETENTION_PASSPHRASE }}
        run: |
          mkdir -p "$RUNNER_TEMP/run5-plaintext"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -pass env:SOURCE_RETENTION_PASSPHRASE \
            -in "$RUNNER_TEMP/run5-encrypted/r2-official-frozen-source-bytes.tar.enc" \
          | tar -C "$RUNNER_TEMP/run5-plaintext" -xf -
      - name: Validate exact ThreatFox CTI normalization and load
        run: |
          test "$(sha256sum "$RUNNER_TEMP/run5-plaintext/raw/threatfox_full.csv.zip" | cut -d' ' -f1)" = "$THREATFOX_ZIP_SHA256"
          unzip -p "$RUNNER_TEMP/run5-plaintext/raw/threatfox_full.csv.zip" full.csv \
          | sha256sum \
          | grep -q "^$THREATFOX_FULL_CSV_SHA256  -$"
          python -m scripts.validate_run5_cti_load \
            --threatfox-zip "$RUNNER_TEMP/run5-plaintext/raw/threatfox_full.csv.zip" \
            --output "$RUNNER_TEMP/run5-evidence/r2-run5-cti-load-validation.json" \
            --work-dir "$RUNNER_TEMP/run5-validation-work" \
            --git-sha "$GITHUB_SHA"
      - name: Write sanitized failure evidence when validation did not complete
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          output = (
              Path(os.environ["RUNNER_TEMP"])
              / "run5-evidence"
              / "r2-run5-cti-load-validation.json"
          )
          if output.is_file():
              raise SystemExit(0)
          builder_path = (
              Path(os.environ["GITHUB_WORKSPACE"])
              / "scripts"
              / "build_vinsoc_public_snapshot.py"
          )
          builder_sha = None
          if builder_path.is_file():
              builder_sha = hashlib.sha256(builder_path.read_bytes()).hexdigest()
          record = {
              "schema_version": "r2_run5_cti_load_validation_v1",
              "status": "failed",
              "git_sha": os.environ["GITHUB_SHA"],
              "input_identity": {
                  "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
                  "source_artifact_id": int(os.environ["SOURCE_ARTIFACT_ID"]),
                  "source_artifact_digest": os.environ["SOURCE_ARTIFACT_DIGEST"],
                  "ciphertext_sha256": os.environ["SOURCE_CIPHERTEXT_SHA256"],
                  "threatfox_zip_sha256": os.environ["THREATFOX_ZIP_SHA256"],
                  "threatfox_full_csv_sha256": os.environ["THREATFOX_FULL_CSV_SHA256"],
              },
              "builder": {
                  "version": os.environ["BUILDER_VERSION"],
                  "sha256": builder_sha,
              },
              "normalized_rows": None,
              "loaded_cti_rows": None,
              "distinct_source_row_id": None,
              "nullable_field_null_counts": {},
              "failure": {"category": "workflow_prevalidation_error"},
          }
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(record, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload credential-free aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-run5-cti-load-validation-evidence
          path: ${{ runner.temp }}/run5-evidence/r2-run5-cti-load-validation.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove decrypted and plaintext working data
        if: always()
        run: |
          rm -rf \
            "$RUNNER_TEMP/run5-plaintext" \
            "$RUNNER_TEMP/run5-validation-work" \
            "$RUNNER_TEMP/run5-encrypted"
          rm -f "$RUNNER_TEMP/run5-artifact.zip" "$RUNNER_TEMP/run5-artifact.json"
