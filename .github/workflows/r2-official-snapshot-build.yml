name: R2 official three-source snapshot build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-official-snapshot-build
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Retrieve and verify complete current source bytes
        run: python -m scripts.probe_r2_official_sources --output "$RUNNER_TEMP/r2-official-source-probe"
      - name: Stage exact verified builder inputs and provenance
        run: |
          python -m scripts.stage_r2_official_sources \
            --probe-dir "$RUNNER_TEMP/r2-official-source-probe"
      - name: Build twice and lock binary plus logical identity
        run: |
          python -m scripts.build_r2_official_snapshot \
            --report "$RUNNER_TEMP/r2-official-snapshot-build.json"
      - name: Preserve exact verified source bytes for reproducible rebuilds
        if: always()
        id: source_retention
        uses: actions/upload-artifact@v4
        with:
          name: r2-official-frozen-source-bytes
          path: |
            ${{ runner.temp }}/r2-official-source-probe/probe.json
            ${{ runner.temp }}/r2-official-source-probe/receipts/
            ${{ runner.temp }}/r2-official-source-probe/raw/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Record retained source identity and hashes
        if: always()
        env:
          SOURCE_ARTIFACT_ID: ${{ steps.source_retention.outputs.artifact-id }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.source_retention.outputs.artifact-digest }}
          SOURCE_ARTIFACT_URL: ${{ steps.source_retention.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          probe_path = Path(os.environ["RUNNER_TEMP"]) / "r2-official-source-probe" / "probe.json"
          source_hashes = {}
          if probe_path.is_file():
              probe = json.loads(probe_path.read_text(encoding="utf-8"))
              for source in probe.get("sources", []):
                  hashes = {}
                  for section_name in ("transport", "ingest"):
                      section = source.get(section_name)
                      if isinstance(section, dict) and isinstance(section.get("sha256"), str):
                          hashes[f"{section_name}_sha256"] = section["sha256"]
                  source_hashes[source["dataset_id"]] = hashes
          record = {
              "schema_version": "r2_official_source_retention_v1",
              "storage": {
                  "type": "github_actions_artifact",
                  "name": "r2-official-frozen-source-bytes",
                  "artifact_id": os.environ.get("SOURCE_ARTIFACT_ID", ""),
                  "artifact_digest": os.environ.get("SOURCE_ARTIFACT_DIGEST", ""),
                  "artifact_url": os.environ.get("SOURCE_ARTIFACT_URL", ""),
              },
              "source_hashes": source_hashes,
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "r2-official-source-retention.json"
          output.write_text(json.dumps(record, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Preserve credential-free build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-official-snapshot-build-metadata
          path: |
            ${{ runner.temp }}/r2-official-snapshot-build.json
            ${{ runner.temp }}/r2-official-source-retention.json
            evaluation/text_to_sql_benchmarks/dataset_manifest.json
            evaluation/text_to_sql_benchmarks/source_receipts/
            evaluation/text_to_sql_benchmarks/snapshot_manifest.json
            evaluation/text_to_sql_benchmarks/official_snapshot.lock
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve canonical verified snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r2-official-snapshot-duckdb
          path: data/snapshots/vinsoc_public_v1.duckdb
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
