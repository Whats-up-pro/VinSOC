name: R1 A1 secret preflight (no API calls)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VINSOC_EVAL_MODEL: gpt-4.1-2025-04-14
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check secret and dev split without contacting OpenAI
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if not os.environ.get("OPENAI_API_KEY"):
              raise SystemExit("BLOCKED: OPENAI_API_KEY is unavailable to this workflow")
          print("OPENAI_API_KEY: present (value not displayed)")

          model = os.environ.get("VINSOC_EVAL_MODEL")
          if model != "gpt-4.1-2025-04-14":
              raise SystemExit("BLOCKED: pinned VINSOC_EVAL_MODEL is unavailable")
          print(f"VINSOC_EVAL_MODEL: {model}")

          paths = sorted(Path("evaluation/tool_calling/benchmarks/dev").glob("*.json"))
          case_ids = [json.loads(path.read_text(encoding="utf-8"))["case_id"] for path in paths]
          if len(paths) != 24 or len(set(case_ids)) != 24:
              raise SystemExit("BLOCKED: dev must contain 24 distinct case IDs")
          print("R1 A1 dev: 24 distinct cases")
          print("No API request or model run was made")
          PY
