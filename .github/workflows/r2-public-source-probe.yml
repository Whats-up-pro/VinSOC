name: R2 public source probe (no model)
# Re-run only after explicit edits to this workflow; the job never calls a model.

on:
  push:
    branches: [codex/r2-public-eval]
    paths: [.github/workflows/r2-public-source-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download complete public source files, hash and inspect
        run: python scripts/probe_r2_public_sources.py --output "$RUNNER_TEMP/public-source-probe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-source-probe
          path: ${{ runner.temp }}/public-source-probe/probe.json
          if-no-files-found: warn
          retention-days: 7
