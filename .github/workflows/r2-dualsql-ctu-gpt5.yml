name: R2 DualSQL CTU GPT-5 Mini
run-name: dualsql-ctu-${{ inputs.condition }}

on:
  workflow_dispatch:
    inputs:
      condition:
        description: One CTU dev condition to execute after exact-SHA CI
        required: true
        type: choice
        options:
          - E1
          - E2
          - E3

permissions:
  contents: read
  actions: read

concurrency:
  group: dualsql-ctu-${{ inputs.condition }}
  cancel-in-progress: false

jobs:
  condition:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CTU_MANIFEST: evaluation/ctu_network_public/dataset_manifest.json
      SNAPSHOT_DIR: ${{ runner.temp }}/dualsql_snapshots
      EVIDENCE_DIR: ${{ runner.temp }}/dualsql_evidence
      CONDITION: ${{ inputs.condition }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout and first attempt
        run: |
          test "$GITHUB_REF" = "refs/heads/master"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify exact-SHA CI and single dispatch
        run: |
          python - <<'PY'
          import json, os, subprocess

          repo, sha = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"]
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))

          ci = api(f"repos/{repo}/actions/runs?head_sha={sha}&per_page=100")
          if not any(run["head_sha"] == sha and run["name"] == "CI"
                     and run["conclusion"] == "success" for run in ci["workflow_runs"]):
              raise SystemExit("Full CI Python 3.11/3.12 is not green on GITHUB_SHA")
          prior = api(f"repos/{repo}/actions/workflows/r2-dualsql-ctu-gpt5.yml/runs"
                      "?event=workflow_dispatch&per_page=100")
          title = "dualsql-ctu-" + os.environ["CONDITION"]
          if any(str(run["id"]) != os.environ["GITHUB_RUN_ID"]
                 and run["display_title"] == title for run in prior["workflow_runs"]):
              raise SystemExit("This condition already has a dispatch; no rerun")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Download pinned CTU S5/S7 and verify two snapshots
        run: |
          python -m evaluation.dualsql_lite_ctu_gpt5.workflow prepare \
            --snapshot-dir "$SNAPSHOT_DIR" --evidence-dir "$EVIDENCE_DIR"
      - name: Run exactly one condition after price, account and cost gates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EVAL_MODEL: ${{ secrets.OPENAI_EVAL_MODEL }}
          OPENAI_ORGANIZATION_ID: ${{ secrets.OPENAI_ORGANIZATION_ID }}
          OPENAI_PROJECT_ID: ${{ secrets.OPENAI_PROJECT_ID }}
          OPENAI_PRICE_CHECKED_UTC: ${{ vars.OPENAI_PRICE_CHECKED_UTC }}
          OPENAI_CREDIT_CHECKED_UTC: ${{ vars.OPENAI_CREDIT_CHECKED_UTC }}
          OPENAI_CURRENT_INPUT_USD_M: ${{ vars.OPENAI_CURRENT_INPUT_USD_M }}
          OPENAI_CURRENT_OUTPUT_USD_M: ${{ vars.OPENAI_CURRENT_OUTPUT_USD_M }}
          OPENAI_USABLE_CREDIT_USD: ${{ vars.OPENAI_USABLE_CREDIT_USD }}
          OPENAI_SPEND_LIMIT_REMAINING_USD: ${{ vars.OPENAI_SPEND_LIMIT_REMAINING_USD }}
          VINSOC_CUMULATIVE_KNOWN_USD: ${{ vars.VINSOC_CUMULATIVE_KNOWN_USD }}
        run: |
          python -m evaluation.dualsql_lite_ctu_gpt5.workflow run \
            --condition "$CONDITION" --snapshot-dir "$SNAPSHOT_DIR" \
            --evidence-dir "$EVIDENCE_DIR"
      - name: Remove source bytes and DuckDB files
        if: always()
        run: |
          python -m evaluation.dualsql_lite_ctu_gpt5.workflow cleanup \
            --snapshot-dir "$SNAPSHOT_DIR"
      - name: Upload credential-free JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dualsql-ctu-${{ inputs.condition }}-${{ github.run_id }}
          path: ${{ runner.temp }}/dualsql_evidence/*.json
          if-no-files-found: ignore
          retention-days: 90
