name: R2 DualSQL-Lite CTU GPT-5 Mini E0-E3
# Controlled E0-E3 series for CTU-only Text-to-SQL with GPT-5 Mini.
# Uses the fixed dualsql_lite_ctu_gpt5_v1 framework.
# Prior public-dev DualSQL v1-v4 artifacts remain immutable.

on:
  workflow_dispatch:
    inputs:
      condition:
        description: 'Condition to run (E0, E1, E2, E3, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - E0
          - E1
          - E2
          - E3

permissions:
  contents: read

concurrency:
  group: r2-dualsql-ctu-gpt5-${{ inputs.condition }}
  cancel-in-progress: false

env:
  MODEL: gpt-5-mini-2025-08-07
  REASONING_EFFORT: low
  CAP: 1000
  MAX_RETRIES: 0
  INPUT_PRICE_USD_M: 0.15
  OUTPUT_PRICE_USD_M: 0.60
  CEILING_USD: 0.15

jobs:
  preflight:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.sha.outputs.sha }}
      git_status_clean: ${{ steps.sha.outputs.clean }}
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "clean=$(git status --porcelain | wc -l)" >> $GITHUB_OUTPUT
      - name: Verify clean working tree
        run: |
          if [ "${{ steps.sha.outputs.clean }}" != "0" ]; then
            echo "ERROR: Working tree is not clean"
            git status --short
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify DualSQL framework
        run: |
          python - <<'PY'
          from evaluation.dualsql_lite_ctu_gpt5.agents import (
              DualSQLCaseRunner, LINKER_INSTRUCTIONS, GENERATOR_INSTRUCTIONS,
              LINKER_PROMPT_VERSION, GENERATOR_PROMPT_VERSION
          )
          from evaluation.dualsql_lite_ctu_gpt5.tools import TOOL_SCHEMAS, TOOL_VERSION
          print(f"Linker version: {LINKER_PROMPT_VERSION}")
          print(f"Generator version: {GENERATOR_PROMPT_VERSION}")
          print(f"Tools version: {TOOL_VERSION}")
          print(f"Tool schemas: {[s['function']['name'] for s in TOOL_SCHEMAS]}")
          PY

  budget-preflight:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Calculate conservative budget ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from evaluation.ctu_network_public.contract import CASES
          from evaluation.text_to_sql import SQLBenchmarkCase
          from evaluation.dualsql_lite_ctu_gpt5.experiment import BudgetGate

          cases = [
              SQLBenchmarkCase.from_dict(json.loads(p.read_text()))
              for p in sorted(CASES.glob("*.json"))
          ]
          print(f"Cases loaded: {len(cases)}")
          schema = "network_flows(source_dataset VARCHAR)"
          budget = BudgetGate(cases, schema, budget_usd=0.15)
          print(f"Conservative ceiling: ${budget.ceiling_usd:.4f}")
          if budget.ceiling_usd >= 0.15:
              raise ValueError(f"Budget ceiling ${budget.ceiling_usd:.4f} exceeds limit $0.15")
          PY

  run-e0:
    if: needs.preflight.outputs.commit_sha && (github.event.inputs.condition == 'all' || github.event.inputs.condition == 'E0')
    needs: [preflight, budget-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run E0 condition
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          from evaluation.ctu_network_public.contract import CASES
          from evaluation.text_to_sql import SQLBenchmarkCase
          from evaluation.dualsql_lite_ctu_gpt5.experiment import run_condition, make_client, SERIES_VERSION

          SNAPSHOT = Path("data/ctu_network_public/snapshots/ctu_dev.duckdb")
          OUTPUT = Path(f"results/evaluation_v1/ctu_network_public/{SERIES_VERSION}/e0-{os.environ['GITHUB_RUN_ID']}")
          OUTPUT.mkdir(parents=True, exist_ok=True)

          cases = [SQLBenchmarkCase.from_dict(json.loads(p.read_text())) for p in sorted(CASES.glob("*.json"))]
          client = make_client()

          print(f"Running E0 on {len(cases)} cases...")
          report = run_condition(condition="E0", cases=cases, snapshot_path=SNAPSHOT, client=client, output_dir=OUTPUT)

          receipt = {
              "run_id": os.environ['GITHUB_RUN_ID'], "condition": "E0", "series_version": SERIES_VERSION,
              "commit_sha": "${{ needs.preflight.outputs.commit_sha }}",
              "execution_accuracy": report["metrics"]["execution_accuracy"],
              "total_cost_usd": report["total_cost_usd"], "model_calls": report["model_calls"],
              "latency_ms": report["latency_ms"], "eligible": report["eligible"],
              "completed_at": datetime.now(timezone.utc).isoformat()
          }
          with open(OUTPUT / "receipt.json", "w") as f:
              json.dump(receipt, f, indent=2)
          print(f"E0 Complete: {report['metrics']['execution_accuracy']}")
          PY
      - name: Upload E0 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dualsql-ctu-e0-evidence-${{ github.run_id }}
          path: results/evaluation_v1/ctu_network_public/dualsql_lite_ctu_gpt5_v1/e0-*/
          if-no-files-found: error
          retention-days: 90

  run-e1:
    if: needs.preflight.outputs.commit_sha && (github.event.inputs.condition == 'all' || github.event.inputs.condition == 'E1')
    needs: [preflight, budget-preflight]
    runs-on: ubuntu-latest
