          OUTPUT.mkdir(parents=True, exist_ok=True)

          cases = [SQLBenchmarkCase.from_dict(json.loads(p.read_text())) for p in sorted(CASES.glob("*.json"))]
          client = make_client()

          print(f"Running E1 on {len(cases)} cases...")
          report = run_condition(condition="E1", cases=cases, snapshot_path=SNAPSHOT, client=client, output_dir=OUTPUT)

          receipt = {
              "run_id": os.environ['GITHUB_RUN_ID'], "condition": "E1", "series_version": SERIES_VERSION,
              "commit_sha": "${{ needs.preflight.outputs.commit_sha }}",
              "execution_accuracy": report["metrics"]["execution_accuracy"],
              "total_cost_usd": report["total_cost_usd"], "model_calls": report["model_calls"],
              "latency_ms": report["latency_ms"], "eligible": report["eligible"],
              "completed_at": datetime.now(timezone.utc).isoformat()
          }
          with open(OUTPUT / "receipt.json", "w") as f:
              json.dump(receipt, f, indent=2)
          print(f"E1 Complete: {report['metrics']['execution_accuracy']}")
          PY
      - name: Upload E1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dualsql-ctu-e1-evidence-${{ github.run_id }}
          path: results/evaluation_v1/ctu_network_public/dualsql_lite_ctu_gpt5_v1/e1-*/
          if-no-files-found: error
          retention-days: 90

  run-e2:
    if: needs.preflight.outputs.commit_sha && (github.event.inputs.condition == 'all' || github.event.inputs.condition == 'E2')
    needs: [preflight, budget-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run E2 condition
        env:
