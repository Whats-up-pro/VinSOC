name: R2 public source byte probe (one shot)
on:
  push:
    branches: [master]
    paths: [.github/r2-source-probe.run]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe official source bytes without exposing credentials
        run: |
          python - <<'PYCODE'
          import hashlib
          import json
          import os
          import urllib.request
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'r2-source-probe'
          root.mkdir(parents=True, exist_ok=True)
          result = {'checked_utc': datetime.now(timezone.utc).isoformat(), 'sources': {}}
          key = os.environ.get('THREATFOX_AUTH_KEY', '')
          ctu = 'https://mcfp.felk.cvut.cz/publicDatasets/CTU-Malware-Capture-Botnet-44/detailed-bidirectional-flow-labels/capture20110812.binetflow'
          otrf = 'https://raw.githubusercontent.com/OTRF/Security-Datasets/master/datasets/compound/apt29/day1/apt29_evals_day1_manual.zip'
          fox = 'https://threatfox.abuse.ch/export/'
          def save():
              (root/'probe.json').write_text(json.dumps(result, indent=2) + '\n')
          def download(url, name, limit):
              target = root/name
              h = hashlib.sha256()
              received = 0
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'VinSOC-source-probe/1'}), timeout=35) as response, target.open('wb') as f:
                  status = response.status
                  if status != 200:
                      raise ValueError(f'HTTP {status}')
                  for chunk in iter(lambda: response.read(1024*1024), b''):
                      received += len(chunk)
                      if received > limit:
                          raise ValueError(f'source exceeds byte limit {limit}')
                      f.write(chunk);h.update(chunk)
              return {'bytes':received, 'sha256':h.hexdigest(), 'retrieved_at_utc':datetime.now(timezone.utc).isoformat()}
          try:
              with urllib.request.urlopen(urllib.request.Request(ctu, method='HEAD'), timeout=35) as response:
                  result['sources']['ctu13']={'url':ctu,'http_status':response.status,'content_length':response.headers.get('Content-Length'), 'status':'size_probe_only; original bytes not downloaded'}
          except Exception as exc:
              result['sources']['ctu13']={'url':ctu,'status':'blocked','error_type':type(exc).__name__, 'error':str(exc)[:160]}
          save()
          try:
              proof = download(otrf,'otrf_original.zip',32*1024*1024)
              with zipfile.ZipFile(root/'otrf_original.zip') as z:
                  proof['archive_members']=[{'name':x.filename,'bytes':x.file_size} for x in z.infolist() if x.filename.lower().endswith(('.json','.jsonl','.ndjson'))]
              result['sources']['otrf']={'url':otrf,'status':'downloaded','format':'zip',**proof}
          except Exception as exc:
              (root/'otrf_original.zip').unlink(missing_ok=True)
              result['sources']['otrf']={'url':otrf,'status':'blocked','error_type':type(exc).__name__,'error':str(exc)[:160]}
          save()
          if not key:
              result['sources']['threatfox']={'url':fox,'status':'blocked','error_type':'MissingSecret','error':'THREATFOX_AUTH_KEY not available in job; no download attempted'}
          else:
              endpoint='https://threatfox-api.abuse.ch/v2/files/exports/'+key+'/full.csv.zip'
              try:
                  proof = download(endpoint,'threatfox_original.zip',32*1024*1024)
                  with zipfile.ZipFile(root/'threatfox_original.zip') as z:
                      members=[i for i in z.infolist() if i.filename.lower().endswith('.csv') and not i.is_dir()]
                      proof['archive_csv_members']=[{'name':i.filename,'bytes':i.file_size} for i in members]
                      if len(members)==1:
                          csv=root/'threatfox_full.csv'
                          digest=hashlib.sha256()
                          with z.open(members[0]) as f, csv.open('wb') as out:
                              for chunk in iter(lambda:f.read(1024*1024),b''):
                                  out.write(chunk);digest.update(chunk)
                          proof['extracted_csv_sha256']=digest.hexdigest()
                          proof['extracted_csv_bytes']=csv.stat().st_size
                          proof['extracted_from_archive_member']=members[0].filename
                  result['sources']['threatfox']={'url':fox,'status':'downloaded','format':'zip','authenticated_export':'full.csv.zip',**proof}
              except Exception as exc:
                  for filename in ('threatfox_original.zip','threatfox_full.csv'):
                      (root/filename).unlink(missing_ok=True)
                  result['sources']['threatfox']={'url':fox,'status':'blocked','error_type':type(exc).__name__,'error':str(exc).replace(key,'[redacted]').replace(endpoint,fox)[:160]}
          save()
          print(json.dumps({'checked_utc':result['checked_utc'],'status':{k:v['status'] for k,v in result['sources'].items()}},sort_keys=True))
          PYCODE
      - name: Preserve sanitized provenance and available source bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-source-probe
          path: ${{ runner.temp }}/r2-source-probe/
          if-no-files-found: warn
          retention-days: 30
