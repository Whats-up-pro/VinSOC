name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - codex/r2-public-eval
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VINSOC_SOC_REQUIRED: "1"
      VINSOC_SOC_SOURCE_DIR: data/soc_traces_v1/source
      VINSOC_SOC_CORPUS_PATH: data/soc_traces_v1/corpus/corpus.duckdb
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install duckdb==1.5.5
      - name: Restore pinned SOC corpus
        run: |
          python scripts/prepare_soc_traces.py --fetch --source-dir "$VINSOC_SOC_SOURCE_DIR" --output-dir data/soc_traces_v1/corpus
      - name: Run full repository test suite
        run: |
          python -m pytest -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soc-offline-corpus-${{ github.sha }}-${{ matrix.python-version }}
          path: data/soc_traces_v1/corpus/corpus_receipt.json
          if-no-files-found: error

  query-real-data:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      VINSOC_QUERY_REAL_DATA_REQUIRED: "1"
      VINSOC_QUERY_CGROUP_ROOT: /sys/fs/cgroup/vinsoc-query-workers
      VINSOC_QUERY_OBSERVATION_DIR: .vinsoc/query-real-data-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned dependencies and isolated worker backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          python -m pip install -r requirements.txt
          python -m pip install duckdb==1.5.5
      - name: Delegate kernel resource controllers to unprivileged worker supervisor
        run: |
          test -f /sys/fs/cgroup/cgroup.controllers
          sudo sh -c 'echo "+memory +cpu +pids" > /sys/fs/cgroup/cgroup.subtree_control'
          sudo mkdir /sys/fs/cgroup/vinsoc-query-workers
          sudo sh -c 'echo "+memory +cpu +pids" > /sys/fs/cgroup/vinsoc-query-workers/cgroup.subtree_control'
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/vinsoc-query-workers
      - name: Restore exact original snapshots from pinned user-delivered bundle
        run: |
          mkdir -p .vinsoc/query-real-data-ci
          python -m scripts.restore_query_data_bundle --repo . --bundle VinSOC_Runtime_DB_20261010.zip > .vinsoc/query-real-data-ci/bundle_restore_receipt.json
          python - <<'PYTHON'
          import json
          from pathlib import Path
          from scripts.restore_query_data_bundle import verify_ctu_bundle
          receipt = verify_ctu_bundle(Path('VinSOC_CTU_20261010.zip'))
          Path('.vinsoc/query-real-data-ci/ctu_bundle_receipt.json').write_text(json.dumps(receipt, indent=2))
          PYTHON
      - name: Restore both pinned CTU raw sources without rebuilding snapshots
        run: |
          python - <<'PYTHON'
          import hashlib, json, shutil, urllib.request
          from pathlib import Path
          from scripts.export_vinsoc_db_bundle import SOURCES
          root = Path('.').resolve()
          for source in SOURCES['ctu']['sources']:
              target = root / source['path']
              if target.resolve() != target or not target.is_relative_to(root):
                  raise ValueError('UNSAFE_CTU_SOURCE_DESTINATION')
              if not target.exists():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with urllib.request.urlopen(source['source_url'], timeout=120) as response, target.open('xb') as output:
                      shutil.copyfileobj(response, output)
              with target.open('rb') as handle:
                  observed = hashlib.file_digest(handle, 'sha256').hexdigest()
              if observed != source['file_sha256']:
                  raise ValueError('PINNED_CTU_SOURCE_CHECKSUM_MISMATCH')
          Path('.vinsoc/query-real-data-ci/ctu_sources_receipt.json').write_text(json.dumps(SOURCES['ctu'], indent=2))
          PYTHON
      - name: Verify pinned sources and replay all 120 gold queries
        run: |
          python -m scripts.validate_original_query_data --restore-sources --output .vinsoc/query-real-data-ci/real_data_validation.json
      - name: Required real DB and isolated worker checks (no missing-input skips)
        run: |
          python -m pytest -q tests/test_query_real_data.py tests/test_query_bundle_restore.py tests/test_query_worker_boundaries.py --junitxml=.vinsoc/query-real-data-ci/required_checks.xml
      - name: Preserve isolated worker startup diagnostic after a failure
        if: failure()
        run: |
          python - <<'PYTHON'
          import json, subprocess
          from pathlib import Path
          from evaluation.r2_cross_domain_v1.data import DatabaseContext
          from vinsoc_text2sql.executor import SqlExecutor
          report = json.loads(Path('results/evaluation_v1/ctu_network_public/r2_phase2_live/20261001_3f9d72d/suite/report.json').read_text())
          sql = next(c['final_sql'] for c in report['case_results'] if c['case_id'] == 'ctu_sql_001')
          context = DatabaseContext.from_manifest(Path('evaluation/r2_cross_domain_v1/runtime_registry.json'), 'ctu_dev')
          request = json.dumps({'sql': sql, 'parameters': [], 'row_cap': 10000, 'timeout_seconds': 10})
          try:
              result = subprocess.run(SqlExecutor()._command(context.snapshot_path), input=request, text=True, capture_output=True, env={}, timeout=13)
              diagnostic = {'exit_code': result.returncode, 'stdout': result.stdout, 'stderr': result.stderr, 'external_model_calls': 0}
          except subprocess.TimeoutExpired:
              diagnostic = {'status': 'WORKER_STARTUP_TIMEOUT', 'external_model_calls': 0}
          Path('.vinsoc/query-real-data-ci/worker_startup_diagnostic.json').write_text(json.dumps(diagnostic, indent=2))
          print(json.dumps(diagnostic))
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: query-real-data-${{ github.sha }}-${{ matrix.python-version }}
          path: .vinsoc/query-real-data-ci/
          if-no-files-found: error
          retention-days: 90

  cloud-input-availability:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report cloud input availability without API requests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NETWORK_E2E_GATES_JSON: ${{ secrets.NETWORK_E2E_GATES_JSON }}
          NETWORK_E2E_WINDOW_STATE_JSON: ${{ secrets.NETWORK_E2E_WINDOW_STATE_JSON }}
          NETWORK_E2E_SNAPSHOT_URL: ${{ secrets.NETWORK_E2E_SNAPSHOT_URL }}
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          names=('OPENAI_API_KEY','NETWORK_E2E_GATES_JSON','NETWORK_E2E_WINDOW_STATE_JSON','NETWORK_E2E_SNAPSHOT_URL')
          present={name:bool(os.environ.get(name)) for name in names}
          result={'scope':'cloud_input_availability_only_no_model_call',
                  'status':'inputs_available_not_yet_validated' if all(present.values()) else 'blocked_missing_cloud_inputs',
                  'present':present,'attempted_calls':0,'responses_received':0,'client_created':False,'new_inference_cost_usd':0}
          path=Path(os.environ['RUNNER_TEMP'])/'cloud-input-availability.json'
          path.write_text(json.dumps(result,indent=2),encoding='utf-8')
          print(json.dumps(result))
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-input-availability-${{ github.sha }}
          path: ${{ runner.temp }}/cloud-input-availability.json
          if-no-files-found: error
          retention-days: 90
